# Local MongoDB for Whoply development.
#
#   docker compose up -d      start (data survives restarts)
#   docker compose down       stop
#   docker compose down -v    stop AND wipe the database
#
# This matches the default MONGODB_URI (mongodb://localhost:27017/whoply), so a
# teammate can get a working database without installing MongoDB at all.
# No auth is configured on purpose — it is bound to localhost for local dev only.
services:
  mongo:
    image: mongo:7
    container_name: whoply-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - whoply_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  whoply_mongo_data:
